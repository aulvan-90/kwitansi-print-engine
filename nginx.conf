# ==============================================================================
# Nginx Reverse Proxy Configuration for aulvan-server
# Domain: kwitansi.aulvan.com
# Target Upstream: http://127.0.0.1:3025 (Docker Container: kwitansi-print-engine)
# ==============================================================================

# 1. HTTP Server Block (Port 80)
# Digunakan untuk serving awal dan tantangan verifikasi Certbot ACME
server {
    listen 80;
    listen [::]:80;
    server_name kwitansi.aulvan.com;

    # Log files
    access_log /var/log/nginx/kwitansi.aulvan.com.access.log;
    error_log /var/log/nginx/kwitansi.aulvan.com.error.log;

    # Verifikasi Let's Encrypt Webroot (Opsional jika menggunakan certbot certonly/webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Proxy Pass ke Container Docker Kwitansi Port 3025
    location / {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;

        # Header Proxy Standar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Connection upgrade (jika dibutuhkan)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer & Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }
}

